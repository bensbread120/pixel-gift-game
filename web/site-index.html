<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel gift games</title>
  <style>
    :root { --paper: #fff8ec; --ink: #2b1d2a; --muted: #6f6170; --accent: #d4507a; }
    @media (prefers-color-scheme: dark) { :root { --paper: #141419; --ink: #eeeaf0; --muted: #a49cab; --accent: #e86a8e; } }
    html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); }
    body { display: flex; align-items: center; justify-content: center; padding: 0 16px; font: 16px/1.5 system-ui, sans-serif; text-align: center; }
    svg { width: 56px; height: 56px; }
    h1 { font-size: 24px; margin: 12px 0 8px; }
    p { color: var(--muted); margin: 0 0 8px; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 7 6" aria-hidden="true" shape-rendering="crispEdges">
      <path fill="#e86a8e" d="M1 0h2v1h1V0h2v1h1v2H6v1H5v1H4v1H3V5H2V4H1V3H0V1h1z"/>
      <path fill="#f6b3c6" d="M1 1h1v1H1z"/>
    </svg>
    <h1>Pixel gift games</h1>
    <p>Small, personal games made as gifts.</p>
    <p>Ordered one? <a href="/order/">Fill in your order form</a>.</p>
  </main>
</body>
</html>
